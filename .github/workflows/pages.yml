name: Build and deploy JC Science PreTeXt

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: oscarlevin/pretext-full
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source structure
        run: python tools/check_source.py

      - name: Audit three reading routes
        run: python tools/audit_learning_routes.py

      - name: Install pinned PreTeXt
        run: python -m pip install -r requirements.txt

      - name: Show PreTeXt version
        run: pretext --version

      - name: Build web book
        run: pretext build web

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/output/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
